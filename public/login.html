<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AuraHostel ERP Enterprise</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="glass-panel p-4 p-md-5" style="max-width: 460px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
        <i class="fa-solid fa-building-user"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">AuraHostel ERP</h3>
      <p class="text-muted small">Intelligent Hostel Operations & Student Living</p>
    </div>

    <!-- Alert Container -->
    <div id="loginAlertContainer"></div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold text-muted">Email / Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
          <input type="text" id="loginEmail" class="form-control form-control-custom border-start-0" placeholder="warden@aurahostel.com" required value="warden@aurahostel.com">
        </div>
      </div>

      <div class="mb-4">
        <label for="loginPassword" class="form-label small fw-semibold text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="loginPassword" class="form-control form-control-custom border-start-0" placeholder="••••••••" required value="admin123">
        </div>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-cyan w-100 rounded-pill py-2.5 fw-semibold mb-3">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to Dashboard
      </button>

      <div class="mb-3">
        <label class="form-label small text-muted mb-2">Select Account Role:</label>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-primary text-start p-2.5 d-flex justify-content-between align-items-center" onclick="document.getElementById('loginEmail').value='warden@aurahostel.com'; document.getElementById('loginPassword').value='admin123';">
            <span><i class="fa-solid fa-user-shield me-2 text-primary"></i>Chief Warden</span>
            <span class="badge bg-primary-subtle text-primary">Warden</span>
          </button>
          <button type="button" class="btn btn-outline-secondary text-start p-2.5 d-flex justify-content-between align-items-center" onclick="document.getElementById('loginEmail').value='admin@aurahostel.com'; document.getElementById('loginPassword').value='admin123';">
            <span><i class="fa-solid fa-user-gear me-2 text-secondary"></i>Campus Administrator</span>
            <span class="badge bg-secondary-subtle text-secondary">Admin</span>
          </button>
          <button type="button" class="btn btn-outline-success text-start p-2.5 d-flex justify-content-between align-items-center" onclick="document.getElementById('loginEmail').value='alex@aurahostel.com'; document.getElementById('loginPassword').value='student123';">
            <span><i class="fa-solid fa-user-graduate me-2 text-success"></i>Resident Student (Room A-101)</span>
            <span class="badge bg-success-subtle text-success">Student</span>
          </button>
        </div>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
